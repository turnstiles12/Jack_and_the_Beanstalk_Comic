# Render injects PORT; locally defaults to 8080.
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
server.shutdown=graceful

# ---- Which image engine: cloudflare | openai | fal | mock (mock = free placeholder art for smoke tests) ----
beanstalk.image.provider=${IMAGE_PROVIDER:cloudflare}

# ---- Cloudflare Workers AI: FLUX.1 schnell (TEXT-to-image only: no reference photo, square output) ----
beanstalk.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
beanstalk.cloudflare.token=${CLOUDFLARE_API_TOKEN:}
beanstalk.cloudflare.model=@cf/black-forest-labs/flux-1-schnell
beanstalk.cloudflare.steps=${CLOUDFLARE_STEPS:8}

# ---- OpenAI (Images edits endpoint; the child's photo is the input image on every call) ----
beanstalk.openai.key=${OPENAI_API_KEY:}
beanstalk.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# gpt-image-1 was retired 2026-10-23. gpt-image-1.5 supports input_fidelity=high.
# For gpt-image-2.x set OPENAI_INPUT_FIDELITY to empty (that parameter must be omitted there).
beanstalk.openai.model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
beanstalk.openai.size=1024x1536
beanstalk.openai.quality=${OPENAI_IMAGE_QUALITY:medium}
beanstalk.openai.input-fidelity=${OPENAI_INPUT_FIDELITY:high}

# ---- fal.ai (alternative provider, FLUX + PuLID) ----
beanstalk.fal.key=${FAL_KEY:}
beanstalk.fal.endpoint=https://fal.run/fal-ai/flux-pulid
beanstalk.image.width=768
beanstalk.image.height=1152
beanstalk.image.steps=20
beanstalk.image.id-weight=1.0

# ---- shared generation behaviour ----
beanstalk.image.max-attempts=3
beanstalk.image.parallelism=${IMAGE_PARALLELISM:2}
beanstalk.image.seed=20261026

# ---- optional identity check: none | openai | anthropic ----
beanstalk.verify.provider=${VERIFY_PROVIDER:none}
beanstalk.verify.openai-key=${OPENAI_API_KEY:}
beanstalk.verify.openai-model=${VERIFY_OPENAI_MODEL:gpt-4.1-mini}
beanstalk.verify.anthropic-key=${ANTHROPIC_API_KEY:}
beanstalk.verify.anthropic-model=${VERIFY_ANTHROPIC_MODEL:claude-sonnet-4-5}
