# Render injects PORT; locally defaults to 8080.
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
server.shutdown=graceful

# ---- Which image engine: cloudflare-ref (uses the uploaded reference image) | cloudflare (text-only) | openai | fal | fal-flux2 | mock ----
beanstalk.image.provider=${IMAGE_PROVIDER:fal}

# ---- Cloudflare Workers AI: FLUX.1 schnell (TEXT-to-image only: no reference photo, square output) ----
beanstalk.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
beanstalk.cloudflare.token=${CLOUDFLARE_API_TOKEN:}
beanstalk.cloudflare.model=@cf/black-forest-labs/flux-1-schnell
beanstalk.cloudflare.steps=${CLOUDFLARE_STEPS:8}

# ---- OpenAI (Images edits endpoint; the child's photo is the input image on every call) ----
beanstalk.openai.key=${OPENAI_API_KEY:}
beanstalk.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# gpt-image-1 was retired 2026-10-23. gpt-image-1.5 supports input_fidelity=high.
# For gpt-image-2.x set OPENAI_INPUT_FIDELITY to empty (that parameter must be omitted there).
beanstalk.openai.model=${OPENAI_IMAGE_MODEL:gpt-image-1.5}
beanstalk.openai.size=1024x1536
beanstalk.openai.quality=${OPENAI_IMAGE_QUALITY:medium}
beanstalk.openai.input-fidelity=${OPENAI_INPUT_FIDELITY:high}

# ---- fal.ai (default provider: FLUX + PuLID face lock; sent with enable_safety_checker=false) ----
beanstalk.fal.key=${FAL_KEY:}
# One fal request longer than this is abandoned and retried.
beanstalk.fal.timeout-seconds=${FAL_TIMEOUT_SECONDS:40}
# The reference photo is scaled down to this longest side before it is sent (smaller upload, same face).
# fal.ai allows 10 concurrent requests on this account, so 20 pages go out in exactly 2 waves of 10 (8 meant 3 waves).
# Shared across ALL books being made; anything over the cap just waits. Raise it if the fal concurrency limit is raised.
beanstalk.fal.max-concurrent=${FAL_MAX_CONCURRENT:10}
beanstalk.fal.ref-max-side=${FAL_REF_MAX_SIDE:768}
beanstalk.fal.endpoint=https://fal.run/fal-ai/flux-pulid
# IMAGE_PROVIDER=fal-flux2 only: a FLUX.2 edit endpoint (faster and cheaper than flux-pulid, but no face lock).
# flash is the quickest; also works with .../flux-2/turbo/edit and .../flux-2/klein/9b/edit.
# fal checks every FLUX.2 page unless the account is authorised to turn the checker off; flagged pages are retried with softer wording.
beanstalk.fal.flux2-endpoint=${FAL_FLUX2_ENDPOINT:https://fal.run/fal-ai/flux-2/flash/edit}
# Pre-drawn template art (fal-flux2 only): each story page is drawn once with a stand-in hero and stored in Postgres;
# a book then edits the person into that picture. Missing pages are drawn in the background after start
# (one paid image call per page, 40 in total). TEMPLATE_ART=false goes back to drawing every page from scratch.
beanstalk.template-art.enabled=${TEMPLATE_ART:true}
beanstalk.image.width=768
beanstalk.image.height=1152
# Time per image is roughly proportional to steps. 14 is about 30% quicker than the model default of 20.
beanstalk.image.steps=${IMAGE_STEPS:14}
# true_cfg > 1 turns on the negative prompt (the "no text" guard) but runs the model twice per step.
# FAL_TRUE_CFG=1 roughly halves the time per image, at the risk of stray lettering in the art.
beanstalk.fal.true-cfg=${FAL_TRUE_CFG:1.5}
beanstalk.image.id-weight=1.0

# ---- shared generation behaviour ----
beanstalk.image.max-attempts=4
# All 20 pages are requested at once so a book takes about as long as its slowest page (target: under 60 s).
beanstalk.image.parallelism=${IMAGE_PARALLELISM:20}
# After this many seconds a page that already has an image stops retrying (the best attempt is used).
beanstalk.job.budget-seconds=${JOB_BUDGET_SECONDS:45}
# One image request that takes longer than this is abandoned and retried, instead of stalling the whole book.
beanstalk.cloudflare.timeout-seconds=${CLOUDFLARE_TIMEOUT_SECONDS:40}
beanstalk.image.seed=20261026

# ---- optional identity check: none | openai | anthropic ----
beanstalk.verify.provider=${VERIFY_PROVIDER:none}
beanstalk.verify.openai-key=${OPENAI_API_KEY:}
beanstalk.verify.openai-model=${VERIFY_OPENAI_MODEL:gpt-4.1-mini}
beanstalk.verify.anthropic-key=${ANTHROPIC_API_KEY:}
beanstalk.verify.anthropic-model=${VERIFY_ANTHROPIC_MODEL:claude-sonnet-4-5}

# ---- Access control: shared site password, then Google sign-in ----
# SITE_PASSWORD: the one password every visitor must enter first. Unset = nobody gets in.
beanstalk.auth.site-password=${SITE_PASSWORD:}
# SESSION_SECRET: long random string that signs the login cookie. Unset = random each start (everyone is logged out on restart).
beanstalk.auth.session-secret=${SESSION_SECRET:}
# GOOGLE_CLIENT_ID: OAuth "Web application" client id from Google Cloud Console (public value, not a secret).
beanstalk.auth.google-client-id=${GOOGLE_CLIENT_ID:}
# Set COOKIE_SECURE=true whenever the site is served over HTTPS (Render).
beanstalk.auth.cookie-secure=${COOKIE_SECURE:false}
beanstalk.auth.session-days=30

# ---- Neon Postgres: accounts, finished books and cost totals ----
# DATABASE_URL: the Neon connection string (postgresql://user:pass@host/db?sslmode=require). Required.
beanstalk.database.url=${DATABASE_URL:}

# ---- Stripe: $0.99 per book via Stripe Checkout ----
# STRIPE_SECRET_KEY: sk_test_... while testing, sk_live_... in production. Never commit it.
beanstalk.stripe.secret-key=${STRIPE_SECRET_KEY:}
beanstalk.stripe.price-cents=${BOOK_PRICE_CENTS:99}
# Local development only: skip payment entirely. Leave unset/false in production (missing key then blocks book creation).
beanstalk.stripe.payments-disabled=${STRIPE_PAYMENTS_DISABLED:false}
# Optional fixed public address for Stripe's return links (e.g. https://my-site.onrender.com); default is the address the browser used.
beanstalk.app-base-url=${APP_BASE_URL:}

# ---- Printed copies: printed and shipped by Lulu (Print API), sold for one flat price through Stripe ----
# Client key + secret from https://developers.lulu.com/user-profile/api-keys (sandbox keys come from
# https://developers.sandbox.lulu.com). Lulu bills print + shipping to the card saved on that Lulu account.
beanstalk.lulu.client-key=${LULU_CLIENT_KEY:}
beanstalk.lulu.client-secret=${LULU_CLIENT_SECRET:}
# Sandbox by default: nothing is really printed or charged. Set LULU_API_URL=https://api.lulu.com to go live.
beanstalk.lulu.base-url=${LULU_API_URL:https://api.sandbox.lulu.com}
# Required by Lulu: who they contact about a problem with a print job (the shop owner, not the customer).
beanstalk.lulu.contact-email=${LULU_CONTACT_EMAIL:}
# 6 x 9 in, full colour, standard quality, saddle stitch (stapled; fits the 20-page book), 80# coated paper, gloss cover.
# Check or change it with Lulu's price calculator; the trim size (first 9 characters) must stay 6 x 9 to match the PDF.
beanstalk.lulu.pod-package-id=${LULU_POD_PACKAGE_ID:0600X0900FCSTDSS080CW444GXX}
# MAIL | PRIORITY_MAIL | GROUND | EXPEDITED | EXPRESS
beanstalk.lulu.shipping-level=${LULU_SHIPPING_LEVEL:MAIL}
# What the customer pays for one printed copy, shipping included: $24.99.
beanstalk.print.price-cents=${PRINT_PRICE_CENTS:2499}
# An order is refused if Lulu's print + shipping + tax to that address is above this (price minus Stripe's fee),
# so no single order loses money. International addresses usually cost more.
beanstalk.print.max-lulu-cost-cents=${PRINT_MAX_LULU_COST_CENTS:2390}

# ---- Cost per book: priced from the number of API calls each book actually needed ----
# Blank = built-in rate for the chosen image provider. Set IMAGE_CALL_COST_USD to override.
beanstalk.cost.image-call-usd=${IMAGE_CALL_COST_USD:}
beanstalk.cost.verify-call-usd=${VERIFY_CALL_COST_USD:0.002}
