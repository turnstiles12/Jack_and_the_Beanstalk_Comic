# Render Blueprint: New + > Blueprint, point at this repo.
services:
  - type: web
    name: beanstalk-comic
    runtime: docker
    plan: starter            # free tier (512 MB, sleeps when idle) can run out of memory / drop in-flight books
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: IMAGE_PROVIDER
        value: cloudflare-ref    # cloudflare-ref (reference image) | cloudflare (text-only) | openai | fal | mock
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false          # paste in the Render dashboard
      - key: CLOUDFLARE_API_TOKEN
        sync: false          # token with "Workers AI" permission; never commit it
      # Only needed if you switch IMAGE_PROVIDER to openai:
      # - key: OPENAI_API_KEY
      #   sync: false
      # ---- access control ----
      - key: SITE_PASSWORD
        sync: false          # the shared password visitors type on the first page
      - key: GOOGLE_CLIENT_ID
        sync: false          # OAuth Web client id from Google Cloud Console
      - key: SESSION_SECRET
        generateValue: true  # signs the login cookie; Render generates a random value once
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false          # Neon Postgres connection string; holds accounts, books and cost totals
      - key: IMAGE_PARALLELISM
        value: "2"
      - key: VERIFY_PROVIDER
        value: none          # set to openai (needs OPENAI_API_KEY and a photo) to enable the face-match retry check (extra API calls)
      - key: STRIPE_SECRET_KEY
        sync: false          # Stripe secret key (sk_live_... / sk_test_...); never commit it
