# Render Blueprint: New + > Blueprint, point at this repo.
services:
  - type: web
    name: beanstalk-comic
    runtime: docker
    plan: starter            # free tier (512 MB, sleeps when idle) can run out of memory / drop in-flight books
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: IMAGE_PROVIDER
        value: fal           # fal (FLUX + PuLID face lock, safety checker off) | fal-flux2 (FLUX.2 edit: faster, no face lock, safety checker may reject pages) | cloudflare-ref | cloudflare | openai | mock
      - key: FAL_KEY
        sync: false          # fal.ai API key (https://fal.ai/dashboard/keys); never commit it
      # Only needed if you switch IMAGE_PROVIDER back to cloudflare / cloudflare-ref:
      # - key: CLOUDFLARE_ACCOUNT_ID
      #   sync: false
      # - key: CLOUDFLARE_API_TOKEN
      #   sync: false
      # Only needed if you switch IMAGE_PROVIDER to openai:
      # - key: OPENAI_API_KEY
      #   sync: false
      # ---- access control ----
      - key: SITE_PASSWORD
        sync: false          # the shared password visitors type on the first page
      - key: GOOGLE_CLIENT_ID
        sync: false          # OAuth Web client id from Google Cloud Console
      - key: SESSION_SECRET
        generateValue: true  # signs the login cookie; Render generates a random value once
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false          # Neon Postgres connection string; holds accounts, books and cost totals
      - key: IMAGE_PARALLELISM
        value: "10"          # matches the fal.ai concurrency cap: 20 pages in 2 waves of 10
      - key: JOB_BUDGET_SECONDS
        value: "45"          # after this a page stops retrying and keeps its best image
      - key: VERIFY_PROVIDER
        value: none          # set to openai (needs OPENAI_API_KEY and a photo) to enable the face-match retry check (extra API calls)
      - key: STRIPE_SECRET_KEY
        sync: false          # Stripe secret key (sk_live_... / sk_test_...); never commit it
      # ---- printed copies (Lulu Print API) ----
      - key: LULU_CLIENT_KEY
        sync: false          # from the Lulu developer portal > API keys
      - key: LULU_CLIENT_SECRET
        sync: false          # never commit it
      - key: LULU_CONTACT_EMAIL
        sync: false          # shop owner's email; Lulu writes here about problem print jobs
      - key: LULU_API_URL
        value: https://api.sandbox.lulu.com   # switch to https://api.lulu.com (with live keys) to really print
      - key: APP_BASE_URL
        sync: false          # public https address of this site (Lulu downloads the print PDFs from it)
